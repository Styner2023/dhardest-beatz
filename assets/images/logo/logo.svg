  <g fill="#FF6A3A">
    <path d="M4 41 L8 18 L16.5 30 L25 12 L33.5 30 L42 18 L46 41 Z"/>
    <circle cx="8" cy="17" r="4.2"/>
    <circle cx="25" cy="10.5" r="4.8"/>
    <circle cx="42" cy="17" r="4.2"/>
    <rect x="3" y="44" width="44" height="8.5" rx="2.5"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Arial Black','Arial Bold',Gadget,Arial,Helvetica,sans-serif"
     font-weight="900" font-size="25">
    <text x="62" y="38" fill="#FFFFFF" textLength="155" lengthAdjust="spacingAndGlyphs">D’HARDEST</text>
    <text x="225" y="38" fill="#FF6A3A" textLength="88" lengthAdjust="spacingAndGlyphs">BEATZ</text>
  </g>
</svg>
