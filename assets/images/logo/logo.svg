<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="336" height="56" viewBox="0 0 336 56" role="img" aria-label="D’Hardest Beatz">
  <title>D’Hardest Beatz</title>

